spring:
    application:
        name: config-server
    cloud:
        config:
            server:
                git:
                    uri: https://github.com/ayminacakir/turkcell-microservices-spring-gygy-5.git
                    default-label: main
                    search-paths: microservices/configs/{application}
                    clone-on-start: true
                    force-pull: true

server:
    port: 8888
