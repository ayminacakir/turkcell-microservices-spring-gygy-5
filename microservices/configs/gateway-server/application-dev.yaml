spring:
    application:
        name: gateway-server

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8087/realms/microservices-gygy5

    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: user-service
                          uri: lb://user-service
                          predicates:
                              - Path=/api/users/**

                        - id: product-service
                          uri: lb://product-service
                          predicates:
                              - Path=/api/v1/products/**

                        - id: order-service
                          uri: lb://order-service
                          predicates:
                              - Path=/api/orders/**

                        - id: notification-service
                          uri: lb://notification-service
                          predicates:
                              - Path=/api/notifications/**

server:
    port: 8889

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        fetch-registry: true
        register-with-eureka: true
